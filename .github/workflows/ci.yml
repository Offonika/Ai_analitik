name: CI

"on":
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          package-manager-cache: false

      - name: Install project and development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Check changed whitespace
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            git diff --check \
              "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"
          else
            git diff-tree --check --root -r "$GITHUB_SHA"
          fi

      - name: Run Python lint
        run: python -m ruff check scripts src tests

      - name: Validate web JavaScript syntax
        run: node --check src/wb_unit_economics/web/static/app.js

      - name: Validate documentation and repository safety
        run: |
          python scripts/validate_specs.py
          python scripts/validate_docs_manifest.py
          python scripts/validate_llm_docs.py
          python scripts/docs_route.py --check-generated
          python scripts/validate_documentation_contracts.py
          python scripts/validate_acceptance_matrix.py
          python scripts/build_client_tz_docx.py --check
          python scripts/generate_web_api_reference.py --check
          python scripts/validate_no_secrets.py
          python scripts/check_git_safety.py --tracked

      - name: Check external documentation links
        continue-on-error: true
        run: python scripts/check_external_docs_links.py

  tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run full test suite
        run: python -m pytest -q
