[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "shumeyko-wb-unit-economics"
version = "0.1.0"
description = "Excel MVP for Shumeyko Wildberries unit economics"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "argon2-cffi>=23.1",
  "boto3>=1.34",
  "cryptography>=43",
  "duckdb>=1.0",
  "email-validator>=2.2",
  "fastapi>=0.116",
  "httpx>=0.27",
  "openpyxl>=3.1",
  "openai>=1.99",
  "openai-chatkit>=1.6,<2",
  "polars>=1.0",
  "psycopg[binary]>=3.2",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "PyYAML>=6.0",
  "python-docx>=1.2",
  "python-multipart>=0.0.20",
  "sqlalchemy>=2.0",
  "tenacity>=8.3",
  "uvicorn[standard]>=0.32",
  "xlsxwriter>=3.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"wb_unit_economics.web" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
