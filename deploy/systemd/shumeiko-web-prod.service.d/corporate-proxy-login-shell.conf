[Service]
# The approved corporate proxy is maintained in root's login profile.  Keep its
# address and credentials out of systemd units, runtime environment files and Git.
ExecStart=
ExecStart=/bin/bash -lc 'exec /usr/bin/env SHUMEYKO_RUNTIME_ENVIRONMENT=production SHUMEYKO_SESSION_COOKIE_NAME=shumeyko_prod_session SHUMEYKO_CLIENT_LOGIN_ENABLED=true SHUMEYKO_EXTERNAL_INTEGRATIONS_ENABLED=true SHUMEYKO_ALLOWED_EXPORT_ROOT=/data/shumeyko/prod/reports SHUMEYKO_DEFAULT_REPORT_WORKBOOK=/data/shumeyko/prod/reports/shumeyko_wb_excel_mvp.xlsx SHUMEYKO_SOURCE_REFRESH_ROOT=/data/shumeyko/source_refresh SHUMEYKO_SOURCE_REFRESH_MIN_FREE_GB=20 /opt/shumeyko-runtime/prod/current/.venv/bin/python -m uvicorn wb_unit_economics.web.app:app --host 127.0.0.1 --port 8097 --workers 1'
