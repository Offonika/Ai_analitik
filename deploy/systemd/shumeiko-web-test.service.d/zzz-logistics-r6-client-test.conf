[Service]
Environment=SHUMEYKO_CLIENT_LOGIN_ENABLED=true
Environment=SHUMEYKO_LOGISTICS_ANALYSIS_ENABLED=true
Environment=SHUMEYKO_LOGISTICS_ANALYSIS_CLIENT_ENABLED=true
Environment=SHUMEYKO_LOGISTICS_FACTORS_ENABLED=true
Environment=SHUMEYKO_LOGISTICS_FACTORS_CLIENT_ENABLED=true
Environment=SHUMEYKO_LOGISTICS_TARIFFS_ENABLED=true
Environment=SHUMEYKO_LOGISTICS_TARIFFS_CLIENT_ENABLED=true
Environment=SHUMEYKO_LOGISTICS_ROUTES_ENABLED=true
Environment=SHUMEYKO_LOGISTICS_ROUTES_CLIENT_ENABLED=true
Environment=SHUMEYKO_LOGISTICS_MEASUREMENTS_ENABLED=true
Environment=SHUMEYKO_LOGISTICS_MEASUREMENTS_CLIENT_ENABLED=true
Environment=SHUMEYKO_LOGISTICS_RETURN_REASONS_ENABLED=true
Environment=SHUMEYKO_LOGISTICS_RETURN_REASONS_CLIENT_ENABLED=true
ExecStart=
ExecStart=/usr/bin/env SHUMEYKO_RUNTIME_ENVIRONMENT=test SHUMEYKO_SESSION_COOKIE_NAME=shumeyko_test_session SHUMEYKO_CLIENT_LOGIN_ENABLED=true SHUMEYKO_EXTERNAL_INTEGRATIONS_ENABLED=false SHUMEYKO_ALLOWED_EXPORT_ROOT=/data/shumeyko/test/reports SHUMEYKO_DEFAULT_REPORT_WORKBOOK=/data/shumeyko/test/reports/none.xlsx SHUMEYKO_SOURCE_REFRESH_ROOT=/data/shumeyko/test/source_refresh SHUMEYKO_LOGISTICS_ANALYSIS_ENABLED=true SHUMEYKO_LOGISTICS_ANALYSIS_CLIENT_ENABLED=true SHUMEYKO_LOGISTICS_FACTORS_ENABLED=true SHUMEYKO_LOGISTICS_FACTORS_CLIENT_ENABLED=true SHUMEYKO_LOGISTICS_TARIFFS_ENABLED=true SHUMEYKO_LOGISTICS_TARIFFS_CLIENT_ENABLED=true SHUMEYKO_LOGISTICS_ROUTES_ENABLED=true SHUMEYKO_LOGISTICS_ROUTES_CLIENT_ENABLED=true SHUMEYKO_LOGISTICS_MEASUREMENTS_ENABLED=true SHUMEYKO_LOGISTICS_MEASUREMENTS_CLIENT_ENABLED=true SHUMEYKO_LOGISTICS_RETURN_REASONS_ENABLED=true SHUMEYKO_LOGISTICS_RETURN_REASONS_CLIENT_ENABLED=true /opt/shumeyko-runtime/test/current/.venv/bin/python -m uvicorn wb_unit_economics.web.app:app --host 127.0.0.1 --port 8098 --workers 1
